services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deez-forex-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forex}:${POSTGRES_PASSWORD:-forex_secret}@shared-postgres:5432/${POSTGRES_DB:-deez_forex}
      REDIS_URL: redis://shared-redis:6379/0
      QDRANT_URL: http://shared-qdrant:6333
      META_API_TOKEN: ${META_API_TOKEN:-}
      META_API_ACCOUNT_ID: ${META_API_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CELERY_BROKER_URL: redis://shared-redis:6379/1
      CELERY_RESULT_BACKEND: redis://shared-redis:6379/2
      DATA_PROVIDER: ${DATA_PROVIDER:-metaapi}
      MT5_ZMQ_HOST: ${MT5_ZMQ_HOST:-host.docker.internal}
      MT5_ZMQ_REQ_PORT: ${MT5_ZMQ_REQ_PORT:-5555}
      MT5_ZMQ_PUB_PORT: ${MT5_ZMQ_PUB_PORT:-5556}
      MT5_RPYC_HOST: ${MT5_RPYC_HOST:-mt5}
      MT5_RPYC_PORT: ${MT5_RPYC_PORT:-18812}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://fx.deeztechnology.solutions}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "28000:8000"
    depends_on:
      - mt5
    networks:
      - shared-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deez-forex-celery
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forex}:${POSTGRES_PASSWORD:-forex_secret}@shared-postgres:5432/${POSTGRES_DB:-deez_forex}
      REDIS_URL: redis://shared-redis:6379/0
      QDRANT_URL: http://shared-qdrant:6333
      META_API_TOKEN: ${META_API_TOKEN:-}
      META_API_ACCOUNT_ID: ${META_API_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CELERY_BROKER_URL: redis://shared-redis:6379/1
      CELERY_RESULT_BACKEND: redis://shared-redis:6379/2
      DATA_PROVIDER: ${DATA_PROVIDER:-metaapi}
      MT5_ZMQ_HOST: ${MT5_ZMQ_HOST:-host.docker.internal}
      MT5_ZMQ_REQ_PORT: ${MT5_ZMQ_REQ_PORT:-5555}
      MT5_ZMQ_PUB_PORT: ${MT5_ZMQ_PUB_PORT:-5556}
      MT5_RPYC_HOST: ${MT5_RPYC_HOST:-mt5}
      MT5_RPYC_PORT: ${MT5_RPYC_PORT:-18812}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://fx.deeztechnology.solutions}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - shared-net
    command: celery -A app.celery_app worker --pool=threads --loglevel=info -Q celery,ai_analysis,execution,data_ingestion,dead_letter

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deez-forex-beat
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forex}:${POSTGRES_PASSWORD:-forex_secret}@shared-postgres:5432/${POSTGRES_DB:-deez_forex}
      REDIS_URL: redis://shared-redis:6379/0
      QDRANT_URL: http://shared-qdrant:6333
      META_API_TOKEN: ${META_API_TOKEN:-}
      META_API_ACCOUNT_ID: ${META_API_ACCOUNT_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CELERY_BROKER_URL: redis://shared-redis:6379/1
      CELERY_RESULT_BACKEND: redis://shared-redis:6379/2
      DATA_PROVIDER: ${DATA_PROVIDER:-metaapi}
      MT5_ZMQ_HOST: ${MT5_ZMQ_HOST:-host.docker.internal}
      MT5_ZMQ_REQ_PORT: ${MT5_ZMQ_REQ_PORT:-5555}
      MT5_ZMQ_PUB_PORT: ${MT5_ZMQ_PUB_PORT:-5556}
      MT5_RPYC_HOST: ${MT5_RPYC_HOST:-mt5}
      MT5_RPYC_PORT: ${MT5_RPYC_PORT:-18812}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://fx.deeztechnology.solutions}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - shared-net
    command: celery -A app.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://fx.deeztechnology.solutions}
    container_name: deez-forex-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://fx.deeztechnology.solutions}
    ports:
      - "23000:3000"
    depends_on:
      - backend
    networks:
      - shared-net
    command: npm start

  mt5:
    build:
      context: ./mt5
      dockerfile: Dockerfile
    container_name: deez-forex-mt5
    privileged: true
    shm_size: 2gb
    volumes:
      - mt5-config:/config
    restart: unless-stopped
    ports:
      - "18812:18812"
      - "15555:5555"
      - "15556:5556"
      - "16901:6901"
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('localhost', 18812)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: deez-forex-dashboard
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "28501:8501"
    depends_on:
      - backend
    networks:
      - shared-net

networks:
  shared-net:
    external: true
    name: shared-net

volumes:
  mt5-config:
    external: true
    name: mt5-config
