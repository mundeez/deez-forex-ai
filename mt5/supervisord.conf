; =============================================================================
; Supervisor config for MT5 Container with KasmVNC Desktop
; Manages: MT5 Terminal (Wine)
; Xvfb/KasmVNC + Openbox are started by startup.sh before supervisor.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; MT5 Terminal -- runs inside Wine in the Openbox desktop session
; ---------------------------------------------------------------------------
[program:mt5_terminal]
command=/bin/bash /app/run_mt5.sh
autostart=true
autorestart=true
startsecs=30
startretries=5
priority=20

; ---------------------------------------------------------------------------
; ZMQ Bridge -- Python script using MetaTrader5 module inside Wine
; ---------------------------------------------------------------------------
[program:zmq_bridge]
command=/bin/bash /app/run_zmq_bridge.sh
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=30
stdout_logfile=/var/log/supervisor/zmq_bridge.log
stderr_logfile=/var/log/supervisor/zmq_bridge.log
