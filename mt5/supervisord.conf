; =============================================================================
; Supervisor config for MT5 Container
; Manages: MT5 Terminal (Wine), Wine Python rpyc server, ZMQ bridge
; Xvfb is started by startup.sh before supervisor.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; MT5 Terminal -- runs inside Wine
; ---------------------------------------------------------------------------
[program:mt5_terminal]
autostart=true
autorestart=true
command=/bin/bash /app/run_mt5.sh
startsecs=30
startretries=5
priority=20

; ---------------------------------------------------------------------------
; Wine Python MT5Service -- exposes typed MT5 API via rpyc on port 18812
; Runs mt5_service.py inside Wine Python (where MetaTrader5 package works)
; Waits for MT5 to be ready before starting
; ---------------------------------------------------------------------------
[program:mt5_service]
command=/bin/bash /app/run_mt5_service.sh
startsecs=10
startretries=5
priority=30

; ---------------------------------------------------------------------------
; Wine Python SlaveService -- generic rpyc on port 18813 (mt5linux compat)
; ---------------------------------------------------------------------------
[program:mt5_slave_service]
command=/bin/bash /app/run_slave_service.sh
startsecs=10
startretries=5
priority=40

[program:x11vnc]
command=x11vnc -display :99 -forever -noxkb -rfbport 5901 -rfbauth /etc/vncpwd
autostart=true
autorestart=true
startsecs=3
priority=10

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6901 localhost:5901
autostart=true
autorestart=true
startsecs=3
priority=11
