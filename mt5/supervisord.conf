; =============================================================================
; Supervisor config for MT5 Container with KasmVNC Desktop
; Manages: MT5 Terminal (Wine), RPyC MT5Service, RPyC SlaveService,
;          Redis Tick Publisher
; Xvfb/KasmVNC + Openbox are started by startup.sh before supervisor.
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[unix_http_server]
file=/var/run/supervisor/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; MT5 Terminal -- runs inside Wine in the Openbox desktop session
; ---------------------------------------------------------------------------
[program:mt5_terminal]
command=/bin/bash /app/run_mt5.sh
autostart=true
autorestart=true
startsecs=30
startretries=5
priority=20

; ---------------------------------------------------------------------------
; RPyC MT5Service -- custom typed service on port 18812
; ---------------------------------------------------------------------------
[program:mt5_rpyc_service]
command=/bin/bash /app/run_mt5_service.sh
autostart=true
autorestart=true
startsecs=60
startretries=10
priority=30

; ---------------------------------------------------------------------------
; RPyC SlaveService -- mt5linux compat / debug on port 18813
; ---------------------------------------------------------------------------
[program:mt5_slave_service]
command=/bin/bash /app/run_slave_service.sh
autostart=true
autorestart=true
startsecs=65
startretries=10
priority=31

; ---------------------------------------------------------------------------
; Redis Tick Publisher -- Linux Python, polls MT5 via mt5linux, pushes to Redis
; ---------------------------------------------------------------------------
[program:redis_tick_publisher]
command=/bin/bash /app/run_redis_publisher.sh
autostart=true
autorestart=true
startsecs=30
startretries=10
priority=40

; ---------------------------------------------------------------------------
; ZMQ Bridge -- Wine Python using MetaTrader5 module, exposes REQ/REP ZMQ
; ---------------------------------------------------------------------------
[program:zmq_bridge]
command=/bin/bash /app/run_zmq_bridge.sh
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=35
stdout_logfile=/var/log/supervisor/zmq_bridge.log
stderr_logfile=/var/log/supervisor/zmq_bridge.log
